experiment_description: 'Multiview teleop fine-tune from the ABC production EMA: 51
  five-camera teleop episodes with camera_pair_choices (top / gemini305 / gemini335
  equally weighted into the canonical top slot), wrists fixed; the two Gemini side
  views have no extrinsics so tcp_label_camera=top zeroes their tcp_valid and they
  train the action head only. Otherwise identical to the ft_teleop50 recipe: lr 1e-4,
  warmup 500, 6k steps, balanced 1/3 teleop + 1/3 ABC real + 1/3 ABC sim.'
