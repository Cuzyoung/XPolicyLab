name: pass_ball

shape_meta: &shape_meta
  obs:
    camera0_rgb:
      shape: [3, 224, 224]
      horizon: 2
      latency_steps: 0
      down_sample_steps: 3
      type: rgb
    camera1_rgb:
      shape: [3, 224, 224]
      horizon: 2
      latency_steps: 0
      down_sample_steps: 3
      type: rgb
    robot0_eef_pos: {shape: [3], horizon: 2, latency_steps: 0, down_sample_steps: 3, type: low_dim}
    robot0_eef_rot_axis_angle: {raw_shape: [3], shape: [6], horizon: 2, latency_steps: 0, down_sample_steps: 3, type: low_dim, rotation_rep: rotation_6d}
    robot0_gripper_width: {shape: [1], horizon: 2, latency_steps: 0, down_sample_steps: 3, type: low_dim}
    robot1_eef_pos: {shape: [3], horizon: 2, latency_steps: 0, down_sample_steps: 3, type: low_dim}
    robot1_eef_rot_axis_angle: {raw_shape: [3], shape: [6], horizon: 2, latency_steps: 0, down_sample_steps: 3, type: low_dim, rotation_rep: rotation_6d}
    robot1_gripper_width: {shape: [1], horizon: 2, latency_steps: 0, down_sample_steps: 3, type: low_dim}
  # Consecutive action rows at native 30 Hz; observation history stays at 10 Hz.
  action: {shape: [20], horizon: 16, latency_steps: 0, down_sample_steps: 1, rotation_rep: rotation_6d}

dataset:
  _target_: XPolicyLab.policy.UMI_DP.upstream.diffusion_policy.dataset.lerobot_image_dataset.LeRobotImageDataset
  dataset_path: ${oc.env:UMI_DP_DATASET_DIR}
  image_cache_dir: ${oc.env:UMI_DP_IMAGE_CACHE,null}
  use_mmap: true
  shape_meta: *shape_meta
  action_mode: relative_trajectory
  observation_mode: relative
  pose_frame: world
  position_unit: m
  rotation_layout: column
  val_ratio: 0.0
  seed: 42

env_runner: null
