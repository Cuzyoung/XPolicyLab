# @package _global_
# Canonical G0.5 joint AR+FM objective, aligned with the LIBERO tokenizer path.
model:
  model_arch:
    discrete_action: true
    continuous_action: true
    fm:
      fm_weight: 1.0
      # Keep FM gradients out of the shared VLM used by the AR objective.
      joint_training: false
    ar:
      block_wise_autoregressive: false
      ce_weight: 1.0
tokenizer:
  vq_config:
    block_wise_autoregressive: false
