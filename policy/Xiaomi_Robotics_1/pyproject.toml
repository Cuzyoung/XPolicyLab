[project]
name = "xiaomi-robotics-1-inference"
version = "0.1.0"
description = "Isolated XR1 inference environment for XPolicyLab"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0",
  "torchvision==0.23.0",
  "flash-attn==2.8.3",
  "transformers==4.57.1",
  "liger-kernel==0.6.5",
  "mmengine==0.10.7",
  "accelerate==1.11.0",
  "safetensors==0.6.2",
  "numpy==2.1.3",
  "pillow==11.3.0",
  "scipy==1.18.1",
  "einops==0.8.2",
  "xpolicylab",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.8cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }
xpolicylab = { path = "../..", editable = true }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
