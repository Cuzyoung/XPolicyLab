# YAM LeRobot v3 layout for LingBot-VLA2 real-robot post-training.
# Arm targets are anchor-relative qpos: action[t + k] - observation.state[t].
# Gripper targets remain absolute, matching the official relative-qpos contract.
states:
  - observation.state.arm.position:
      origin_keys:
        - observation.state:
            start: 0
            end: 6
        - observation.state:
            start: 7
            end: 13
  - observation.state.effector.position:
      origin_keys:
        - observation.state:
            start: 6
            end: 7
        - observation.state:
            start: 13
            end: 14

actions:
  - action.arm.position:
      origin_keys:
        - action:
            start: 0
            end: 6
        - action:
            start: 7
            end: 13
      subtract_state: true
  - action.effector.position:
      origin_keys:
        - action:
            start: 6
            end: 7
        - action:
            start: 13
            end: 14
      subtract_state: false

images:
  - observation.images.camera_top:
      origin_keys: observation.images.top_rgb
  - observation.images.camera_wrist_left:
      origin_keys: observation.images.left_rgb
  - observation.images.camera_wrist_right:
      origin_keys: observation.images.right_rgb

# The launcher passes a relative-action-specific stats path explicitly.
norm_stats: null
